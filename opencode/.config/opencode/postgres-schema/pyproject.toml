[project]
name = "opencode-postgres-schema"
version = "0.1.0"
description = "Safe PostgreSQL schema inspection CLI for OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
postgres-schema = "postgres_schema_inspector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgres_schema_inspector"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: optional tests requiring POSTGRES_SCHEMA_INTEGRATION_URL",
]
